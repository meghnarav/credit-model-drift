version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: credit_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: credit_audit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d credit_audit"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  ml-engine:
    build:
      context: .
      dockerfile: ml-engine.Dockerfile
    container_name: ml_engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - postgres

  core-backend:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: core_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/credit_audit
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password
      - ML_ENGINE_BASE_URL=http://ml-engine:8000
    depends_on:
      postgres:
        condition: service_healthy
      ml-engine:
        condition: service_started

  client-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: client_ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    depends_on:
      - core-backend

volumes:
  pgdata:
